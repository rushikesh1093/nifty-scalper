version: "3.9"

services:
  # ── TimescaleDB (PostgreSQL + timeseries extension) ──────────────────────
  db:
    image: timescale/timescaledb:latest-pg16
    container_name: nifty_db
    restart: unless-stopped
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: "1093"
      POSTGRES_DB: nifty_scalper
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 10s
      timeout: 5s
      retries: 5

  # ── Redis ────────────────────────────────────────────────────────────────
  redis:
    image: redis:7.2-alpine
    container_name: nifty_redis
    restart: unless-stopped
    ports:
      - "6379:6379"
    volumes:
      - redisdata:/data
    command: redis-server --save 60 1 --loglevel warning
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 3s
      retries: 5

  # ── FastAPI backend ───────────────────────────────────────────────────────
  backend:
    build:
      context: ../backend
      dockerfile: Dockerfile
    container_name: nifty_backend
    restart: unless-stopped
    env_file:
      - ../backend/.env
    environment:
      POSTGRES_HOST: db
      REDIS_HOST: redis
    ports:
      - "8000:8000"
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    volumes:
      - ../backend:/app

  # ── Next.js frontend ──────────────────────────────────────────────────────
  frontend:
    build:
      context: ../frontend
      dockerfile: Dockerfile
    container_name: nifty_frontend
    restart: unless-stopped
    ports:
      # This machine only: Next 14 is end-of-life and has unpatched advisories
      # (docs/FRONTEND_AUDIT.md). "3000:3000" would publish it to the LAN.
      - "127.0.0.1:3000:3000"
    environment:
      # Browser-side JS uses localhost (port-mapped through Docker host)
      NEXT_PUBLIC_API_URL: http://localhost:8000/api/v1
      NEXT_PUBLIC_WS_URL: ws://localhost:8000/api/v1
      # Server-side Next.js (SSR / Route Handlers / Server Components) must use
      # the internal Docker service name — "localhost" inside the container
      # resolves to the frontend container itself, not the backend.
      BACKEND_INTERNAL_URL: http://backend:8000/api/v1
    depends_on:
      - backend

volumes:
  pgdata:
  redisdata:
